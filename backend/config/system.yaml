evolution:
  main_cycle: "1H"
  daily_evolution_time: "20:30"
  generations: 60
  population: 300
  crossover_rate: 0.7
  mutation_rate: 0.2
  train_months: 6
  validation_months: 6
  test_months: 6
  seed_reserve_gens: 10
  seed_reserve_ratio: 0.2
  template_ratio: 0.6
  max_tree_depth: 8
  stages:
    - name: "stage1_single_factor"
      max_tree_depth: 4
      min_ic: 0.03
    - name: "stage2_combo"
      min_sharpe: 0.8
      cross_family_required: true
    - name: "stage3_template_fill"
      min_test_sharpe: 0.6

risk:
  max_total_margin_ratio: 0.8
  single_symbol_max_dd: 0.10
  daily_max_loss: 0.05
  manual_switch_required: true
  if_close_today_forbidden: true
  max_positions_per_symbol: 3
  circuit_breaker_consecutive_errors: 3
  max_margin_per_symbol: 15000

families:
  momentum:
    weight: 0.20
    primitives:
      - ts_return
      - ts_corr_ma
      - cs_rank_return
      - ts_slope
      - ts_momentum_break
  mean_reversion:
    weight: 0.15
    primitives:
      - zscore
      - rsi
      - distance_from_ma
      - bb_position
      - ts_min_max_position
  volatility:
    weight: 0.15
    primitives:
      - ts_std
      - atr
      - ts_range
      - vol_regime
      - realized_vol
  price_volume:
    weight: 0.15
    primitives:
      - ts_corr_pv
      - volume_zscore
      - obv
      - volume_price_divergence
      - money_flow
  term_structure:
    weight: 0.10
    primitives:
      - basis
      - roll_yield
      - spread_nf
      - basis_zscore
      - contango_ratio
  open_interest:
    weight: 0.10
    primitives:
      - oi_change
      - oi_price_divergence
      - oi_vol_ratio
      - oi_zscore
      - oi_momentum
  microstructure:
    weight: 0.10
    primitives:
      - night_gap
      - opening_range
      - idr_ratio
      - night_gap_filter
      - session_return
  macro_proxy:
    weight: 0.05
    primitives:
      - comex_gold_return
      - crude_return
      - usd_index
      - a50_return
      - bond_yield_spread
