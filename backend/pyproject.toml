[tool.poetry]
name = "futures-factor-mining"
version = "1.0.0"
description = "期货自动进化因子挖掘系统后端"
authors = ["Quant Team <quant@example.com>"]
readme = "README.md"
packages = [{include = "backend"}, {include = "quant_engine"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
python-multipart = "^0.0.20"
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"

sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
aiosqlite = "^0.21.0"
alembic = "^1.14.0"

redis = "^5.2.0"
httpx = "^0.28.0"

numpy = "^1.26.0"
pandas = "^2.2.0"
numba = "^0.61.0"
scipy = "^1.15.0"
scikit-learn = "^1.6.0"

pyyaml = "^6.0.2"
python-dotenv = "^1.0.1"

# 进化算法
deap = "^1.4.2"

# GPU加速 (RTX 5070 Ti Blackwell架构 - 需要PyTorch Nightly)
# CUDA 12.8 版本，支持 sm_120 架构
torch = {url = "https://download.pytorch.org/whl/nightly/cu128/torch-2.8.0.dev20250520%2Bcu128-cp311-cp311-win_amd64.whl", optional = true}
torchvision = {url = "https://download.pytorch.org/whl/nightly/cu128/torchvision-0.23.0.dev20250520%2Bcu128-cp311-cp311-win_amd64.whl", optional = true}
torchaudio = {url = "https://download.pytorch.org/whl/nightly/cu128/torchaudio-2.2.0.dev20250520%2Bcu128-cp311-cp311-win_amd64.whl", optional = true}

# 天勤SDK (可选，实盘交易需要)
tqsdk = {version = "^3.5.0", optional = true}

# 监控/日志
prometheus-client = "^0.21.0"
structlog = "^24.4.0"
psycopg2-binary = "^2.9.12"
pyarrow = "^24.0.0"

# WebSocket支持
websockets = "^12.0"

[tool.poetry.extras]
tq = ["tqsdk"]
gpu = ["torch", "torchvision", "torchaudio"]
full = ["tqsdk", "torch", "torchvision", "torchaudio"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
black = "^24.10.0"
ruff = "^0.9.0"
mypy = "^1.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  | migrations
  | __pycache__
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
